name: Check Documentation

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  # External links rot in pages nobody is editing, so check them on a schedule
  # as well as on push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: Check Anchor Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Corepack must provide pnpm before setup-node resolves the pnpm cache.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Mintlify app's link-rot check already validates page paths, but it
      # ignores the #fragment. This adds anchor checking, which the CLI can only
      # do alongside its path check. External links are checked by the lychee
      # job below.
      - name: Check anchor links
        run: pnpm check:links

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pre-commit hook formats staged pages, but commits made in the GitHub
      # web editor or without the hook installed skip it.
      - name: Check MDX formatting
        run: |
          pnpm format
          if ! git diff --quiet -- '*.mdx'; then
            git diff --stat -- '*.mdx'
            echo "::error::Some MDX files are not formatted. Run 'pnpm format' and commit the changes."
            exit 1
          fi

  external-links:
    name: Check External Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      # Configuration lives in lychee.toml
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir "$PWD" '**/*.mdx'
        env:
          # Raises the rate limit for the many github.com links
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
