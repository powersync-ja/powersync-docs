name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # For dev publishing

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # Required for OIDC / trusted publishing
  contents: write # Required for changesets pushing commits
  pull-requests: write # Required for changesets creating PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # With pending changesets, this opens or updates the Version Packages PR.
      # When that PR is merged, there are none left and this publishes to npm.
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        if: ${{ github.event_name == 'push' }}
        with:
          version: pnpm changeset:version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run manually on any branch to publish a 0.0.0-dev-<timestamp> snapshot under the dev tag.
      - name: Dev publish
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          pnpm --filter @powersync/docs-content build
          pnpm changeset version --snapshot dev
          pnpm install --no-frozen-lockfile
          pnpm changeset publish --tag dev --no-git-tag
