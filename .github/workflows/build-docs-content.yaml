name: Build Docs Content Package

# The package build fails if a connector snippet, prompt, or diagram it reads
# is missing or malformed, so run it whenever those sources change.
on:
  pull_request:
    paths:
      - 'snippets/**'
      - 'images/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-docs-content.yaml'

jobs:
  build:
    name: Build @powersync/docs-content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @powersync/docs-content build
