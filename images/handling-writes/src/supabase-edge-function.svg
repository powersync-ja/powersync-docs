<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Supabase region: DB, Auth and Edge Function -->
  <rect x="40" y="14" width="985" height="526" rx="20" fill="#F0FDF4" stroke="#3ECF8E" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="70" y="62" font-size="30" font-weight="700" fill="#15803D">Supabase</text>

  <!-- Postgres (top center) -->
  <rect x="600" y="40" width="400" height="120" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="800" y="94" text-anchor="middle" font-size="32" font-weight="600" fill="#0F172A">Postgres</text>
  <text x="800" y="130" text-anchor="middle" font-size="20" fill="#475569">RLS policies enforce authz</text>

  <!-- Edge Function (middle left) -->
  <rect x="70" y="320" width="460" height="180" rx="16" fill="#FFFFFF" stroke="#15803D" stroke-width="4"/>
  <text x="300" y="368" text-anchor="middle" font-size="30" font-weight="600" fill="#0F172A">Edge Function</text>
  <text x="300" y="402" text-anchor="middle" font-size="20" fill="#475569">Reference write endpoint, runs as the user</text>
  <rect x="110" y="426" width="180" height="48" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="200" y="456" text-anchor="middle" font-size="16" fill="#14532D">Mapping hook</text>
  <rect x="310" y="426" width="180" height="48" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="400" y="456" text-anchor="middle" font-size="16" fill="#14532D">Dead-letter hook</text>

  <!-- Supabase Auth (center) -->
  <rect x="690" y="360" width="220" height="100" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <text x="800" y="404" text-anchor="middle" font-size="26" font-weight="600" fill="#0F172A">Supabase Auth</text>
  <text x="800" y="438" text-anchor="middle" font-size="20" fill="#475569">issues JWTs</text>

  <!-- PowerSync (middle right) -->
  <rect x="1180" y="340" width="300" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="1330" y="402" text-anchor="middle" font-size="32" font-weight="600" fill="#0F172A">PowerSync</text>
  <text x="1330" y="440" text-anchor="middle" font-size="22" fill="#475569">Service</text>

  <!-- Client app outline (bottom), holding the mutation uploader and the SDK -->
  <rect x="140" y="640" width="830" height="236" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="164" y="674" font-size="22" font-weight="700" fill="#334155">Client app</text>

  <!-- Mutation uploader (client, left) -->
  <rect x="170" y="700" width="260" height="150" rx="16" fill="#F0FDF4" stroke="#15803D" stroke-width="4"/>
  <text x="300" y="742" text-anchor="middle" font-size="24" font-weight="700" fill="#15803D">Reference uploader</text>
  <text x="300" y="772" text-anchor="middle" font-size="18" fill="#475569">mutation uploader</text>
  <rect x="186" y="790" width="228" height="44" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="300" y="818" text-anchor="middle" font-size="15" fill="#14532D">onFatalTransaction hook</text>

  <!-- PowerSync SDK (client, right) -->
  <rect x="600" y="700" width="340" height="150" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="770" y="764" text-anchor="middle" font-size="30" font-weight="600" fill="#0F172A">PowerSync SDK</text>
  <text x="770" y="800" text-anchor="middle" font-size="20" fill="#475569">local SQLite + upload queue</text>

  <!-- Read path: DB → PowerSync → SDK -->
  <path d="M1000,100 L1330,100 L1330,334" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1346" y="230" font-size="22" fill="#475569">replicates</text>
  <path d="M1330,480 L1330,775 L946,775" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1346" y="630" font-size="22" fill="#475569">syncs</text>

  <!-- SDK hands queued writes to the mutation uploader -->
  <path d="M600,775 L436,775" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="515" y="761" text-anchor="middle" font-size="18" fill="#475569">queue</text>

  <!-- Upload path: mutation uploader → Edge Function → DB -->
  <path d="M300,700 L300,506" fill="none" stroke="#15803D" stroke-width="4" marker-end="url(#arrow-ok)"/>
  <text x="284" y="600" text-anchor="end" font-size="22" fill="#15803D">OpenAPI spec</text>
  <path d="M300,320 L300,100 L594,100" fill="none" stroke="#15803D" stroke-width="4" marker-end="url(#arrow-ok)"/>
  <text x="284" y="200" text-anchor="end" font-size="22" fill="#15803D">writes</text>
  <text x="284" y="228" text-anchor="end" font-size="18" fill="#475569">atomic, RLS applies</text>

  <!-- Auth links -->
  <path d="M690,410 L530,410" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="610" y="394" text-anchor="middle" font-size="20" fill="#475569">verifies token</text>
  <path d="M910,410 L1180,410" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="1103" y="394" text-anchor="middle" font-size="18" fill="#475569">verifies token</text>
  <path d="M800,460 L800,700" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="816" y="588" font-size="20" fill="#475569">gets token</text>
</svg>
