<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#FFF7ED"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#FED7AA" stroke-width="8"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Source DB (top center) -->
  <rect x="600" y="40" width="400" height="120" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="800" y="94" text-anchor="middle" font-size="32" font-weight="600" fill="#0F172A">Source DB</text>
  <text x="800" y="130" text-anchor="middle" font-size="22" fill="#475569">Postgres, MongoDB, …</text>

  <!-- Write endpoint (middle left) -->
  <rect x="70" y="320" width="460" height="180" rx="16" fill="url(#hatch)" stroke="#C2410C" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="300" y="424" text-anchor="middle" font-size="88" font-weight="700" fill="#C2410C">?</text>
  <text x="300" y="472" text-anchor="middle" font-size="22" font-weight="600" fill="#9A3412">Write endpoint: up to you</text>

  <!-- Auth provider (center) -->
  <rect x="690" y="360" width="220" height="100" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <text x="800" y="404" text-anchor="middle" font-size="26" font-weight="600" fill="#0F172A">Auth provider</text>
  <text x="800" y="438" text-anchor="middle" font-size="20" fill="#475569">issues JWTs</text>

  <!-- PowerSync (middle right) -->
  <rect x="1180" y="340" width="300" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="1330" y="402" text-anchor="middle" font-size="32" font-weight="600" fill="#0F172A">PowerSync</text>
  <text x="1330" y="440" text-anchor="middle" font-size="22" fill="#475569">Service</text>

  <!-- Client app outline (bottom), holding uploadData and the SDK -->
  <rect x="140" y="640" width="830" height="236" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="164" y="674" font-size="22" font-weight="700" fill="#334155">Client app</text>

  <!-- uploadData (client, left) -->
  <rect x="170" y="700" width="260" height="150" rx="16" fill="url(#hatch)" stroke="#C2410C" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="300" y="752" text-anchor="middle" font-size="26" font-weight="700" font-family="Menlo, monospace" fill="#C2410C">uploadData()?</text>
  <text x="300" y="790" text-anchor="middle" font-size="18" fill="#9A3412">map, batch, retry,</text>
  <text x="300" y="814" text-anchor="middle" font-size="18" fill="#9A3412">handle rejected writes</text>

  <!-- PowerSync SDK (client, right) -->
  <rect x="600" y="700" width="340" height="150" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="770" y="764" text-anchor="middle" font-size="30" font-weight="600" fill="#0F172A">PowerSync SDK</text>
  <text x="770" y="800" text-anchor="middle" font-size="20" fill="#475569">local SQLite + upload queue</text>

  <!-- Read path: DB → PowerSync → SDK -->
  <path d="M1000,100 L1330,100 L1330,334" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1346" y="230" font-size="22" fill="#475569">replicates</text>
  <path d="M1330,480 L1330,775 L946,775" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1346" y="630" font-size="22" fill="#475569">syncs</text>

  <!-- SDK hands queued writes to uploadData -->
  <path d="M600,775 L436,775" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="515" y="761" text-anchor="middle" font-size="18" fill="#475569">queue</text>

  <!-- Upload path: uploadData → write endpoint? → DB -->
  <path d="M300,700 L300,506" fill="none" stroke="#C2410C" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrow-warn)"/>
  <text x="284" y="600" text-anchor="end" font-size="22" fill="#C2410C">calls?</text>
  <path d="M300,320 L300,100 L594,100" fill="none" stroke="#C2410C" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrow-warn)"/>
  <text x="284" y="214" text-anchor="end" font-size="22" fill="#C2410C">writes</text>

  <!-- Auth links -->
  <path d="M690,410 L530,410" fill="none" stroke="#C2410C" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="610" y="394" text-anchor="middle" font-size="20" fill="#C2410C">verifies token?</text>
  <path d="M910,410 L1180,410" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="1045" y="394" text-anchor="middle" font-size="20" fill="#475569">verifies token</text>
  <path d="M800,460 L800,700" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="816" y="588" font-size="20" fill="#475569">gets token</text>
</svg>
